  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PinkPantheres — DFIR · OSINT · CTF</title>
  <meta name="description" content="Forensic notebook of DFIR work, malware analysis, CTF writeups and OSINT investigations." />
  <link rel="icon" href="assets/cat.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    body { background: #0a0a0f; color: #e8e8f0; font-family: 'Syne', sans-serif; }
    .wrap { max-width: 1000px; margin: auto; padding: 20px; }
    nav { display: flex; justify-content: space-between; margin-bottom: 30px; }
    .nav-name { color: #ff2d78; font-weight: bold; }
    .post-grid { display: grid; gap: 16px; }
    .post-card { border: 1px solid #333; padding: 16px; }
  </style>

</head>

<body>

<div class="wrap">

  <nav>
    <span class="nav-name">PinkPantheres</span>
    <a href="https://github.com/hrippix" target="_blank">GitHub ↗</a>
  </nav>

  <h1>DFIR · OSINT · CTF</h1>

  <div id="post-grid">Loading...</div>

</div>

<script>
async function loadPosts() {
  const grid = document.getElementById('post-grid');
  try {
    const res = await fetch('posts/manifest.json');
    const posts = await res.json();

    grid.innerHTML = posts.map(p => `
      <div class="post-card">
        <h3>${p.title}</h3>
        <p>${p.excerpt}</p>
        <a href="posts/${encodeURIComponent(p.slug)}/index.html">Read →</a>
      </div>
    `).join('');

  } catch (e) {
    grid.innerHTML = "Failed to load posts.";
  }
}

loadPosts();
</script>

</body>
</html>
