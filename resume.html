<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume — Hridhya P · PinkPantheres</title>
  <link rel="icon" href="assets/cat.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #2a2a3a;
      --pink: #ff2d78;
      --pink-dim: #ff2d7844;
      --cyan: #00f5d4;
      --text: #e8e8f0;
      --muted: #7a7a9a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }

    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo { width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--pink); overflow: hidden; }
    .nav-logo img { width: 100%; height: 100%; object-fit: cover; }
    .nav-name { font-size: 16px; font-weight: 800; color: var(--pink); }

    .nav-back { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); text-decoration: none; }
    .nav-back:hover { color: var(--pink); }

    .resume-header {
      padding: 40px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .resume-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .resume-header p { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 4px; }

    .btn {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: 1.5px solid var(--pink);
      color: var(--pink);
      background: transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: var(--pink); color: #fff; }

    .pdf-viewer {
      width: 100%;
      height: 85vh;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      margin-bottom: 40px;
    }

    .pdf-viewer embed {
      width: 100%;
      height: 100%;
    }

    .pdf-fallback {
      display: none;
      padding: 48px;
      text-align: center;
    }

    .pdf-fallback p {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 0;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer p { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="nav-brand" href="index.html">
        <div class="nav-logo"><img src="assets/cat.png" alt="logo"></div>
        <span class="nav-name">PinkPantheres</span>
      </a>
      <a href="index.html" class="nav-back">← Home</a>
    </nav>

    <div class="resume-header">
      <div>
        <h1>Hridhya P — Resume</h1>
        <p>Cybersecurity Engineer · Memory Forensics · Malware Analysis · Incident Response</p>
      </div>
      <a href="assets/hridhyap_resume.pdf" download class="btn">⬇ Download PDF</a>
    </div>

    <div class="pdf-viewer">
      <embed src="assets/hridhyap_resume.pdf" type="application/pdf" />
    </div>

    <footer>
      <p>© <span id="year"></span> Hridhya P — PinkPantheres</p>
      <p>DFIR · OSINT · CTF</p>
    </footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
